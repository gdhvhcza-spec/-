<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرستي الذكية | Smart School v2.0</title>

    <style>
        :root {
            --p: #6366f1; --a: #f59e0b; --bg: #f8fafc; --c: #ffffff;
            --t: #1e293b; --d: #ef4444; --s: #10b981; --glass: rgba(255, 255, 255, 0.9);
        }
        [data-theme="dark"] {
            --bg: #0f172a; --c: #1e293b; --t: #f1f5f9; --glass: rgba(15, 23, 42, 0.9);
        }
        * { box-sizing: border-box; transition: 0.3s; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--t); margin: 0; padding: 0; overflow-x: hidden; }

        /* Sidebar Navigation */
        .menu-toggle { position: fixed; top: 20px; right: 20px; z-index: 3000; background: var(--p); color: white; padding: 10px; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: var(--c); z-index: 2500; padding: 30px 15px; box-shadow: -5px 0 30px rgba(0,0,0,0.1); overflow-y: auto; }
        .sidebar.active { right: 0; }
        .sidebar-item { padding: 12px 15px; margin: 8px 0; border-radius: 12px; cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; }
        .sidebar-item:hover { background: var(--bg); border-color: var(--p); }
        .sidebar-item.active { background: var(--p); color: white; }

        /* Main Container */
        .container { max-width: 800px; margin: 80px auto 20px; padding: 0 20px; }
        .section { display: none; }
        .section.active { display: block; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Cards & UI */
        .card { background: var(--c); border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); border-right: 6px solid var(--p); }
        .btn { border: none; padding: 12px 20px; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-p { background: var(--p); color: white; }
        .btn-a { background: var(--a); color: white; }
        .btn-d { background: var(--d); color: white; }

        /* Books Grid */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
